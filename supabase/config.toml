# Local Supabase project config.
# See https://supabase.com/docs/guides/cli/config for full reference.

project_id = "personal-ai-os"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.pooler]
enabled = false

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[inbucket]
enabled = true
port = 54324

[auth]
enabled = true
site_url = "http://127.0.0.1:4230"
additional_redirect_urls = ["http://127.0.0.1:4230"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = false
enable_confirmations = false

[realtime]
enabled = true

[storage]
enabled = false

[edge_runtime]
enabled = false

[analytics]
enabled = false
