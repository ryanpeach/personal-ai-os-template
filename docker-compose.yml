services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '4230:4230'
    # The Supabase local stack runs on the host (via `supabase start`), not in this
    # container. host.docker.internal resolves to the Docker host on macOS/Windows;
    # on Linux it's mapped via host-gateway below. Next rewrites `/supabase/*` to
    # this URL (see next.config.ts).
    environment:
      - SUPABASE_LOCAL_URL=http://host.docker.internal:54321
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    develop:
      watch:
        - path: app
          action: sync
          target: /app/app
        - path: lib
          action: sync
          target: /app/lib
        - path: public
          action: sync
          target: /app/public
        - path: next.config.ts
          action: sync+restart
          target: /app/next.config.ts
        - path: packages/shared/src
          action: sync+restart
          target: /app/packages/shared/src
        - path: package.json
          action: rebuild
        - path: package-lock.json
          action: rebuild
        - path: packages/shared/package.json
          action: rebuild
