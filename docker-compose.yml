services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '4230:4200'
    # The Supabase local stack runs on the host (via `supabase start`), not in this
    # container. host.docker.internal resolves to the Docker host on macOS/Windows;
    # on Linux it's mapped via host-gateway below.
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    develop:
      watch:
        - path: apps/portal/src
          action: sync
          target: /app/apps/portal/src
        - path: apps/portal/public
          action: sync
          target: /app/apps/portal/public
        - path: apps/portal/angular.json
          action: sync+restart
          target: /app/apps/portal/angular.json
        - path: packages/shared/src
          action: sync+restart
          target: /app/packages/shared/src
        - path: package.json
          action: rebuild
        - path: package-lock.json
          action: rebuild
        - path: apps/portal/package.json
          action: rebuild
        - path: packages/shared/package.json
          action: rebuild
